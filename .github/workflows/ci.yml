name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: latest

      - name: Install dev dependencies
        run: npm ci

      # Types, tests, figure rendering and widths, caption lint, citation audit.
      - name: Check
        run: node engine/cli.ts check

      - name: Build the book
        run: node engine/cli.ts build

      - name: Stats
        run: node engine/cli.ts stats

      # The draft is the most useful artefact a reviewer can have.
      - name: Upload the draft
        uses: actions/upload-artifact@v4
        with:
          name: three-numbers-${{ github.sha }}
          path: build/three-numbers.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Upload figure proofs
        if: failure()
        run: node engine/cli.ts proof --figures --ppi 120 || true

      - name: Upload proofs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: figure-proofs-${{ github.sha }}
          path: build/proof-*.png
          if-no-files-found: ignore
